  <div class="blue-backdrop" aria-hidden="true"></div>
  <header class="topbar page-width">
    <div class="home-menu"><button class="top-icon" id="menu-toggle" aria-label="展开门户导航"><svg><use href="#i-menu"/></svg></button><span>首页</span><svg class="home-chevron"><use href="#i-down"/></svg></div>
    <form class="global-search" role="search" id="portal-search"><svg><use href="#i-search"/></svg><input aria-label="搜索制度、流程、应用、知识和服务" placeholder="搜索制度、流程、应用、知识和服务..."><button type="submit" class="sr-only">搜索</button></form>

  <main class="dashboard page-width" aria-label="企业协同办公统一入口">
    <div class="primary-column">
      <section class="panel quick-panel" aria-labelledby="quick-title">
        <header class="panel-heading"><h2 id="quick-title"><svg class="section-icon"><use href="#i-send"/></svg>快捷入口</h2><div class="tabs" role="tablist" aria-label="快捷服务分类"><button role="tab" aria-selected="true" data-quick-tab="常用服务">常用服务</button><button role="tab" aria-selected="false" data-quick-tab="HR服务">HR服务</button><button role="tab" aria-selected="false" data-quick-tab="财务服务">财务服务</button><button role="tab" aria-selected="false" data-quick-tab="IT服务">IT服务</button></div><button class="small-search" aria-label="搜索快捷服务" data-focus-search><svg><use href="#i-search"/></svg></button></header>
        <div class="quick-grid" id="quick-grid">
          <button class="quick-card" data-service="会议室预定" data-category="行政"><span class="app-icon blue"><svg><use href="#i-calendar"/></svg><b class="calendar-digit">6′</b></span><span><strong>会议室预定</strong><small>会议室预定 | 线上申请</small></span></button>
          <button class="quick-card" data-service="请假申请" data-category="HR服务"><span class="app-icon blue"><svg><use href="#i-calendar"/></svg><b class="calendar-digit">6′</b></span><span><strong>请假申请</strong><small>在线提交 快速审批</small></span></button>
          <button class="quick-card" data-service="费用报销" data-category="财务服务"><span class="app-icon orange"><svg><use href="#i-money"/></svg></span><span><strong>费用报销</strong><small>在线提交 进度查询</small></span></button>
          <button class="quick-card" data-service="IT报障" data-category="IT服务"><span class="app-icon blue"><svg><use href="#i-monitor"/></svg></span><span><strong>IT报障</strong><small>提交工单 快速响应</small></span></button>
          <button class="quick-card" data-service="设备申领" data-category="行政"><span class="app-icon purple"><svg><use href="#i-box"/></svg></span><span><strong>设备申领</strong><small>办公设备 在线申请</small></span></button>
          <button class="quick-card" data-service="账号权限/VPN" data-category="IT服务"><span class="app-icon green"><svg><use href="#i-lock"/></svg></span><span><strong>账号权限/VPN</strong><small>账号申请 权限开通</small></span></button>
        </div>
      </section>
      <section class="panel manuals-panel" aria-labelledby="manuals-title">
        <header class="panel-heading"><h2 id="manuals-title"><svg class="section-icon cube-icon"><use href="#i-cube"/></svg>员工服务中心</h2><div class="tabs" role="tablist" aria-label="员工服务资料"><button role="tab" aria-selected="true" data-manual-tab="操作手册">操作手册</button><button role="tab" aria-selected="false" data-manual-tab="员工指南">员工指南</button><button role="tab" aria-selected="false" data-manual-tab="规章制度">规章制度</button><button role="tab" aria-selected="false" data-manual-tab="常见问题">常见问题</button></div><button class="small-search" aria-label="搜索员工服务资料" data-focus-search><svg><use href="#i-search"/></svg></button></header>
        <div class="manual-surface"><div class="manual-artboard" id="manual-artboard">
          <img class="manual-illustration" src="./assets/manual-illustration.png" alt="员工服务的蓝白色等距办公场景插画" draggable="false">
          <button class="manual-link travel" data-manual="差旅报销操作手册">差旅报销操作手册</button>
          <button class="manual-link leave" data-manual="请假申请操作手册">请假申请操作手册</button>
          <button class="manual-link access" data-manual="账号权限申请操作手册">账号权限申请操作手册</button>
          <button class="manual-link mail" data-manual="企业邮箱配置手册">企业邮箱配置手册</button>
          <button class="manual-link visitor" data-manual="访客预约操作手册">访客预约操作手册</button>
        </div><div class="manual-list" id="manual-list" hidden></div></div>
      </section>

    </div>
    <aside class="secondary-column">
      <section class="panel schedule-panel" aria-label="日程与待办">
        <header class="panel-heading"><svg class="section-icon"><use href="#i-calendar"/></svg><div class="tabs schedule-tabs" role="tablist" aria-label="日程与待办"><button role="tab" aria-selected="true" data-schedule="日程">日程</button><button role="tab" aria-selected="false" data-schedule="待办">待办</button></div><div class="heading-actions"><button class="add-button" aria-label="新建日程" data-info="新建日程">+</button><button class="icon-button" aria-label="查看全部日程" data-info="全部日程"><svg><use href="#i-arrow"/></svg></button></div></header>
        <div class="schedule-list">
          <article class="schedule-card meeting" id="meeting-card"><svg class="event-icon"><use href="#i-calendar"/></svg><div class="event-content"><h3>员工服务项目周会</h3><time>10:00 – 11:00</time><div class="event-footer"><div class="attendees"><img src="./assets/avatar-one.png" alt="参会人"><img src="./assets/avatar-two.png" alt="参会人"><img src="./assets/avatar-three.png" alt="参会人"><span>+3</span></div><div class="meeting-actions"><button class="decline" data-meeting="已拒绝">拒绝</button><button class="accept" data-meeting="已接受">接受</button></div><span class="meeting-response" hidden></span></div></div></article>
          <article class="schedule-card delivery"><svg class="event-icon"><use href="#i-box"/></svg><div class="event-content"><h3>设备签收</h3><time>14:00 – 15:30</time><div class="attendees"><img src="./assets/avatar-one.png" alt="参与人"><img src="./assets/avatar-two.png" alt="参与人"><img src="./assets/avatar-three.png" alt="参与人"><span>+2</span></div></div></article>
          <article class="schedule-card attendance"><span class="event-check"><svg><use href="#i-check"/></svg></span><div class="event-content"><h3>考勤异常待处理</h3></div></article>
        </div>
      </section>
      <section class="panel navigation-panel" aria-labelledby="navigation-title">
        <header class="panel-heading"><h2 id="navigation-title"><svg class="section-icon cube-icon"><use href="#i-cube"/></svg>导航入口</h2></header>
        <div class="navigation-grid" id="navigation-grid">
          <button data-service="员工服务中心"><span class="app-icon orange"><svg><use href="#i-person"/></svg></span><span>员工服务中心</span></button>
          <button data-service="采购系统"><span class="app-icon green"><svg><use href="#i-cart"/></svg></span><span>采购系统</span></button>
          <button data-service="HR系统"><span class="app-icon cyan hr-icon">HR</span><span>HR系统</span></button>
          <button data-service="财务报销"><span class="app-icon red"><svg><use href="#i-money"/></svg></span><span>财务报销</span></button>
          <button data-service="IT服务台"><span class="app-icon purple"><svg><use href="#i-monitor"/></svg></span><span>IT服务台</span></button>
          <button id="online-service"><span class="app-icon blue"><svg><use href="#i-headset"/></svg></span><span>在线客服</span></button>
          <button data-service="信息安全中心"><span class="app-icon green"><svg><use href="#i-shield"/></svg></span><span>信息安全中心</span></button>
          <button data-service="资产平台"><span class="app-icon purple"><svg><use href="#i-layers"/></svg></span><span>资产平台</span></button>
        </div>
      </section>

    </aside>
      <section class="panel notices-panel" aria-labelledby="notices-title">
        <header class="panel-heading"><h2 id="notices-title"><svg class="section-icon bright"><use href="#i-bell"/></svg>通知公告</h2><button class="more-button" data-info="通知公告">更多<svg><use href="#i-right"/></svg></button></header>
        <div class="notice-list">
          <button class="notice-row" data-notice="VPN系统维护通知"><span>VPN系统维护通知</span><time datetime="2026-10-07T06:00">2026-10-07 06:00</time></button>
          <button class="notice-row" data-notice="月度费用报销提交提醒"><span>月度费用报销提交提醒</span><time datetime="2026-10-06T09:00">2026-10-06 09:00</time></button>
          <button class="notice-row" data-notice="考勤管理制度更新通知"><span>考勤管理制度更新通知</span><time datetime="2026-10-05T10:00">2026-10-05 10:00</time></button>
          <button class="notice-row" data-notice="会议室使用安排调整通知"><span>会议室使用安排调整通知</span><time datetime="2026-10-04T14:00">2026-10-04 14:00</time></button>
        </div>
      </section>
      <section class="panel enterprise-panel" aria-labelledby="enterprise-title">
        <header class="panel-heading"><h2 id="enterprise-title"><svg class="section-icon bright"><use href="#i-bell"/></svg>企业动态</h2><button class="more-button" id="news-more" aria-label="查看更多企业动态">更多<svg><use href="#i-right"/></svg></button></header>
        <div class="news-carousel" id="news-carousel" role="region" aria-label="企业动态轮播" tabindex="0" data-slide="0">
          <article class="slide slide-original is-active" id="slide-0" role="group" aria-label="第 1 张，共 3 张：员工智能客服全新上线">
            <div class="news-orbit" aria-hidden="true"></div><span class="decor-cube cube-one" aria-hidden="true"></span><span class="decor-cube cube-two" aria-hidden="true"></span><span class="decor-cube cube-three" aria-hidden="true"></span>
            <div class="slide-copy"><h3>员工智能客服<br>全新上线</h3><p>问制度 · 查进度 · 办业务</p><button class="slide-cta" data-action="assistant" aria-label="立即体验员工智能客服">立即体验<svg><use href="#i-right"/></svg></button></div>
            <img class="banner-robot" src="./assets/service-robot.png" alt="蓝白色智能客服机器人">
            <span class="robot-speech" aria-hidden="true">•••</span>
          </article>
          <article class="slide slide-handbook" id="slide-1" role="group" aria-label="第 2 张，共 3 张：员工服务指引" hidden inert><div class="slide-copy"><h3>办公服务指引<br>一站轻松查阅</h3><p>查制度 · 找流程 · 看手册</p><button class="slide-cta" data-action="handbook">查看指引<svg><use href="#i-right"/></svg></button></div><div class="book-illustration" aria-hidden="true"><span>员工<br>服务指南</span><i></i><i></i></div></article>
          <article class="slide slide-security" id="slide-2" role="group" aria-label="第 3 张，共 3 张：信息安全提醒" hidden inert><div class="slide-copy"><h3>守护账号安全<br>安心高效办公</h3><p>账号保护 · VPN 使用</p><button class="slide-cta" data-action="security">查看提醒<svg><use href="#i-right"/></svg></button></div><svg class="security-illustration" aria-hidden="true"><use href="#i-shield"/></svg></article>
          <button class="carousel-arrow carousel-prev" id="carousel-prev" aria-label="上一条企业动态">‹</button><button class="carousel-arrow carousel-next" id="carousel-next" aria-label="下一条企业动态">›</button>
          <div class="carousel-dots" role="group" aria-label="选择企业动态"><button class="carousel-dot is-active" data-index="0" aria-label="第 1 条：员工智能客服全新上线" aria-current="true"></button><button class="carousel-dot" data-index="1" aria-label="第 2 条：员工服务指引"></button><button class="carousel-dot" data-index="2" aria-label="第 3 条：信息安全提醒"></button></div>
          <p class="sr-only" id="carousel-status" aria-live="polite">第 1 条，共 3 条：员工智能客服全新上线</p>
        </div>
      </section>
  </main>
    <aside class="robot-concierge" id="robot-concierge" aria-label="智能客服助手" hidden>
    <div class="robot-welcome" id="robot-welcome">
      <button class="robot-welcome-message" id="start-robot-chat" type="button" aria-label="点击进入智能客服聊天"><span id="robot-welcome-text" aria-hidden="true"></span></button>
      <button class="robot-welcome-close" id="dismiss-robot-welcome" aria-label="关闭欢迎语" type="button">×</button>
    </div>
    <p class="sr-only" id="robot-announcement" role="status" aria-atomic="true"></p>
    <p class="sr-only" id="robot-drag-help">按住拖动或使用方向键调整位置，点击或按回车打开聊天弹框。</p>
    <button class="robot-launcher" id="robot-launcher" type="button" aria-label="打开智能客服" aria-haspopup="dialog" aria-controls="assistant-dialog" aria-describedby="robot-drag-help" title="点击咨询 · 按住拖动">
      <span class="robot-launcher-art"><img src="./assets/service-robot.png" alt="" width="128" height="128" draggable="false"></span>
    </button>
  </aside>

  <div class="toast" id="portal-toast" role="status" hidden></div>
  <dialog class="assistant-dialog" id="assistant-dialog" aria-labelledby="assistant-dialog-title">
    <h2 class="sr-only" id="assistant-dialog-title">智能客服</h2>
    <button class="assistant-dialog-close" data-close="assistant-dialog" aria-label="关闭智能客服" title="关闭（Esc）" type="button" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <iframe class="assistant-dialog-frame" id="assistant-frame" title="智能客服聊天" referrerpolicy="same-origin"></iframe>
  </dialog>
