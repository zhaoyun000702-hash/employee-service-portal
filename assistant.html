<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2788ff">
  <title>智能客服 · 企业员工服务</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230078ff'/%3E%3Cpath d='M10 13h20v15H10z' fill='white'/%3E%3C/svg%3E">

  <script defer src="./meeting-booking-ui.js?v=dd7a3feaacf6"></script>

  <script defer src="./assistant.js?v=a01eca86c816"></script>
  <meta name="portal-build" content="c9bfb1891bfd">
</head>
<body class="assistant-page">
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 10 18-7-7 18-4-7-7-4Zm7 4L21 3m-11 11v6l4-3"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 10L3 7m9 5 9-5m-9 5v10M7.5 4.5l9 5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 32 32"><rect x="5" y="7" width="22" height="21" rx="2" fill="currentColor" stroke="none"/><path d="M10 4v6m12-6v6M7 13h18" stroke="var(--icon-cutout, #1681ff)" stroke-width="2.2"/><path d="M11 18h3m4 0h3m-10 5h3m4 0h3" stroke="var(--icon-cutout, #1681ff)" stroke-width="2"/></symbol>
    <symbol id="i-box" viewBox="0 0 32 32"><path d="m16 2 13 7.5L16 17 3 9.5 16 2ZM3 12l11.5 6.6V31L3 24.4V12Zm26 0-11.5 6.6V31L29 24.4V12Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 32 32"><path d="M4 6h24v17H4zM11 28h10m-5-5v5" stroke-width="2.6"/><path d="M7 19h18" stroke-width="1.2" opacity=".55"/></symbol>
    <symbol id="i-lock" viewBox="0 0 32 32"><rect x="7" y="13" width="18" height="16" rx="3" fill="currentColor" stroke="none"/><path d="M11 14V9a5 5 0 0 1 10 0v5" stroke-width="3"/><path d="M16 20v4" stroke="var(--icon-cutout,#00c986)" stroke-width="2.5"/><circle cx="16" cy="19" r="2" fill="var(--icon-cutout,#00c986)" stroke="none"/></symbol>
    <symbol id="i-money" viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="24" rx="3" fill="currentColor" stroke="none"/><path d="m12 10 4 6 4-6m-9 7h10m-10 4h10m-5-5v10" stroke="var(--icon-cutout,#ff8a1e)" stroke-width="1.8"/></symbol>
    <symbol id="i-person" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5" fill="currentColor" stroke="none"/><path d="M5 28v-4c0-9 22-9 22 0v4H5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-cart" viewBox="0 0 32 32"><path d="M3 6h4l4 16h15l3-12H8" fill="currentColor" stroke-width="2"/><circle cx="13" cy="27" r="2" fill="currentColor" stroke="none"/><circle cx="25" cy="27" r="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-headset" viewBox="0 0 32 32"><path d="M6 20v-6a10 10 0 0 1 20 0v9c0 4-3 6-8 6" stroke-width="2.5"/><rect x="3" y="15" width="6" height="11" rx="2.5" fill="currentColor" stroke="none"/><rect x="23" y="15" width="6" height="11" rx="2.5" fill="currentColor" stroke="none"/><path d="M17 29h4" stroke-width="3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 32 32"><path d="M16 2 27 7v9c0 7-5 11-11 15C10 27 5 23 5 16V7L16 2Z" fill="currentColor" stroke="none"/><path d="M16 6v10H9c1 5 3 8 7 11V16h7V9Z" fill="var(--icon-cutout,#00c880)" stroke="none"/></symbol>
    <symbol id="i-layers" viewBox="0 0 32 32"><path d="m16 3 14 8-14 8L2 11 16 3Z" fill="currentColor" stroke="none"/><path d="m3 17 13 8 13-8M3 23l13 8 13-8" stroke-width="2.3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M4 10h5l10-6v16L9 14H4v-4Zm5 4 2 7H7l-2-7m14-7c3 1 3 5 0 6" stroke-width="2"/><path d="m20 3 1-1M2 8 1 7" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9" stroke-width="3"/></symbol>
  </defs></svg>
  <img id="user-avatar-source" src="./assets/chat-user.svg" alt="" hidden>
  <svg class="icon-definitions" aria-hidden="true"><defs>
    <symbol id="chat-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 11v6m0-10v.2" stroke="white" stroke-width="2"/></symbol>
    <symbol id="chat-file" viewBox="0 0 24 24"><rect x="3" y="2" width="18" height="21" rx="4" fill="currentColor" stroke="none"/><path d="M7 8h10M7 12h10M7 16h8" stroke="white" stroke-width="1.4"/></symbol>
    <symbol id="chat-upload" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="chat-image" viewBox="0 0 24 24"><rect x="3" y="2" width="18" height="20" rx="2"/><path d="m4 17 5-6 4 4 3-3 5 6"/><circle cx="16" cy="7" r="1.5"/></symbol>
    <symbol id="chat-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12h.1m4.9 0h.1m4.9 0h.1" stroke-width="3"/></symbol>
    <symbol id="chat-case" viewBox="0 0 24 24"><path d="M8 6V3h8v3M2 8h20v12H2z" fill="currentColor" stroke="none"/><path d="M2 11h20m-12 0v3h4v-3" stroke="white" stroke-width="1.5"/></symbol>
    <symbol id="chat-fire" viewBox="0 0 24 24"><path d="M13 1c2 6-2 5-1 9 2-1 3-3 3-5 7 7 9 12 3 17-2 1-3 1-4 1 4-5 0-7-1-9 0 4-5 5-3 9C1 21 0 14 5 8c0 4 2 4 2 6 5-6 1-8 6-13Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="chat-room" viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="24" rx="3" fill="currentColor" stroke="none"/><path d="M9 3v7m14-7v7M5 13h22" stroke="var(--icon-cutout,#1681ff)" stroke-width="2"/><g fill="var(--icon-cutout,#1681ff)" stroke="none"><circle cx="10" cy="19" r="2"/><circle cx="22" cy="19" r="2"/><circle cx="16" cy="17" r="2"/><path d="M6 28v-3c0-5 8-5 8 0v3Zm12 0v-3c0-5 8-5 8 0v3Zm-6-6c0-4 8-4 8 0v6h-8Z"/></g></symbol>
    <symbol id="chat-leave" viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="24" rx="3" fill="currentColor" stroke="none"/><path d="M9 3v7m14-7v7M5 13h22m-18 5h6m-6 5h5" stroke="var(--icon-cutout,#852eff)" stroke-width="2"/><circle cx="23" cy="19" r="3" fill="var(--icon-cutout,#852eff)" stroke="none"/><path d="M18 28v-3c0-5 10-5 10 0v3Z" fill="var(--icon-cutout,#852eff)" stroke="none"/></symbol>
  </defs></svg>
  <div class="blue-backdrop" aria-hidden="true"></div>
  <header class="assistant-topbar page-width">
    <div class="home-menu"><button class="top-icon" id="chat-menu" aria-label="打开页面导航" aria-expanded="false" aria-controls="chat-navigation"><svg><use href="#i-menu"/></svg></button><span>智能客服</span><svg class="home-chevron" aria-hidden="true"><use href="#i-down"/></svg></div>
    <nav class="chat-navigation" id="chat-navigation" aria-label="页面导航" hidden><button id="back-to-portal">返回办公首页</button><button data-new-conversation>开始新对话</button></nav>
    <div class="top-actions"><button class="top-icon help-button" id="chat-help" aria-label="使用帮助">?</button><button class="top-icon apps-button" id="chat-apps" aria-label="查看自助工具"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></button><button class="profile-button" id="chat-profile" aria-label="个人中心"><img src="./assets/avatar-profile.png" alt="员工头像"></button></div>
  </header>
  <main class="assistant-workspace page-width">
    <section class="chat-surface" aria-label="智能客服聊天">
      <div class="chat-tip" id="chat-tip"><svg aria-hidden="true"><use href="#chat-info"/></svg><p>如未能解决问题，可尝试换个问法或发送“人工”转接客服</p><button id="dismiss-chat-tip" aria-label="关闭提示">×</button></div>
      <section class="task-examples" aria-label="常用服务">
        <div class="task-examples-heading"><span>常用服务</span></div>
        <div class="task-example-buttons" id="task-example-buttons"></div>
      </section>
      <div class="chat-transcript" id="chat-transcript" role="log" aria-label="会话记录" aria-live="polite" aria-relevant="additions">
        <article class="chat-message from-assistant welcome-message"><img class="chat-avatar bot-avatar" id="assistant-avatar-source" src="./assets/service-robot.png" alt="智能客服"><div class="message-content"><div class="message-bubble answer-bubble"><p id="assistant-welcome">我是智能客服机器人，7 x 24小时在线，为你解答疑难问题。</p></div></div></article>
      </div>
      <form class="chat-composer" id="assistant-composer">
        <label class="sr-only" for="assistant-question">输入你的问题</label>
        <textarea id="assistant-question" name="question" rows="3" maxlength="2000" placeholder="请输入你的问题..." autocomplete="off"></textarea>
        <div class="composer-attachments" id="composer-attachments" aria-label="已添加附件和知识" hidden></div>
        <div class="composer-toolbar"><div class="composer-actions"><button type="button" id="attach-file" aria-label="上传文件" title="上传文件"><svg aria-hidden="true"><use href="#chat-upload"/></svg><span>上传文件</span></button><span class="toolbar-divider"></span><button type="button" id="attach-image" aria-label="上传图片"><svg aria-hidden="true"><use href="#chat-image"/></svg><span>图片</span></button><span class="toolbar-divider"></span><button type="button" id="cite-knowledge" aria-label="引用知识"><span class="at-icon">@</span><span>引用知识</span></button><button type="button" id="composer-more" aria-label="更多会话操作" aria-expanded="false"><svg><use href="#chat-more"/></svg></button></div><button class="chat-send" id="assistant-send" type="submit"><svg aria-hidden="true"><use href="#i-send"/></svg><span>发送</span></button></div>
        <div class="composer-menu" id="composer-menu" hidden><button type="button" data-new-conversation>开始新对话</button><button type="button" id="contact-support">联系人工客服</button></div>
        <input type="file" id="file-picker" accept=".pdf,.doc,.docx,.txt,.xlsx,.csv" multiple hidden><input type="file" id="image-picker" accept="image/*" multiple hidden>
      </form>
    </section>
    <aside class="chat-sidebar" aria-label="帮助与自助服务">
      <div class="help-categories" role="tablist" aria-label="服务分类"><button role="tab" data-category="制度" aria-selected="false" tabindex="-1">制度</button><button role="tab" data-category="设备" aria-selected="false" tabindex="-1">设备</button><button role="tab" data-category="账号" aria-selected="false" tabindex="-1">账号</button><button role="tab" data-category="网络" aria-selected="true">网络</button><button role="tab" data-category="更多" aria-selected="false" tabindex="-1">更多</button></div>
      <label class="help-search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="help-search" type="search" placeholder="请输入关键词搜索相关问题" aria-label="搜索相关问题"></label>
      <section class="help-card hot-questions"><header><h2><svg class="hot-icon"><use href="#chat-fire"/></svg>热门问题</h2><button class="help-more" id="more-questions">更多<svg><use href="#i-right"/></svg></button></header><div class="question-list" id="question-list"></div><p class="no-questions" id="no-questions" hidden>暂无匹配问题，试试“VPN”“请假”或“设备”。</p></section>
      <section class="help-card self-tools" id="self-tools"><header><h2><svg><use href="#chat-case"/></svg>自助工具</h2><button class="help-more" id="more-tools">更多<svg><use href="#i-right"/></svg></button></header><div class="self-tool-grid"><button data-tool="会议室预定"><span class="app-icon cyan"><svg><use href="#chat-room"/></svg></span><span>会议室预定</span></button><button data-tool="申请设备"><span class="app-icon green"><svg><use href="#i-monitor"/></svg></span><span>申请设备</span></button><button data-tool="请假申请"><span class="app-icon purple"><svg><use href="#chat-leave"/></svg></span><span>请假申请</span></button><button data-tool="系统权限申请"><span class="app-icon orange"><svg><use href="#i-shield"/></svg></span><span>系统权限申请</span></button></div></section>
      <section class="help-card service-notices"><header><h2><svg><use href="#i-bell"/></svg>服务公告</h2><button class="help-more" id="more-notices">更多<svg><use href="#i-right"/></svg></button></header><div class="service-notice-list"><button data-announcement="0"><span>国庆期间 IT 服务支持安排通知</span><time datetime="2024-09-14">2024–09–14</time></button><button data-announcement="1"><span>企业邮箱系统升级维护公告</span><time datetime="2024-09-12">2024–09–12</time></button><button data-announcement="2"><span>新员工账号开通服务指引</span><time datetime="2024-09-10">2024–09–10</time></button></div></section>
    </aside>
  </main>
  <dialog class="assistant-sheet" id="assistant-sheet" aria-labelledby="sheet-title"><header><h2 id="sheet-title"></h2><button class="sheet-close" id="close-sheet" aria-label="关闭">×</button></header><div id="sheet-body"></div></dialog>
  <div class="chat-toast" id="chat-toast" role="status" hidden></div>
  <div class="sr-only" id="execution-status" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
